{% set autogluon_proc_type = "cpu" %}  # [not linux64]
{% set name = "autogluon.multimodal" %}
{% set version = "1.6.0" %}

# {% set autogluon_proc_type = "cpu" if cuda_compiler_version == "None" else "gpu" %}  # [linux64]
# {% set autogluon_proc_type = "cpu" %}   # [not linux64]

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/autogluon/autogluon/archive/refs/tags/v{{ version }}.tar.gz
  sha256: fb0c0565f3d4b01b357985d825fe4840c650e238179b519f419953937114149c

build:
  noarch: python
  script: {{ PYTHON }} -m pip install ./multimodal -vv
  number: 0
  script_env:
    - RELEASE=1

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython                                 # [build_platform != target_platform]
    - numpy  >=1.25.0,<2.4.0                    # [build_platform != target_platform]
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - autogluon.tabular ==1.6.0.dev0
    - chronos-forecasting >=2.3.1,<2.4
    - coreforecast >=0.0.12,<0.0.17
    - einops >=0.7,<1
    - fugue >=0.9.0
    - gluonts >=0.17.0,<0.18.0
    - huggingface_hub >=1.3,<2.0
    - joblib >=1.2,<1.7
    - mlforecast >=0.14.0,<0.15.0
    - networkx >=3.0,<4
    - orjson >=3.9,<4.dev0
    - peft >=0.18.1,<0.20
    - safetensors >=0.4,<1
    - statsforecast >=1.7.0,<2.1.2
    - utilsforecast >=0.2.3,<0.2.12
    - python >={{ python_min }},<3.14
    - numpy >=1.25.0,<2.6.0
    - scipy >=1.5.4,<1.19
    - pandas >=2.0.0,<2.4.0
    - scikit-learn >=1.4.0,<1.8.0
    - pillow >=10.0.1,<13 # bumped upperbound to address CVE
    - tqdm >=4.38,<5
    - boto3 >=1.10,<2
    - pytorch >=2.10,<2.14
    - torchvision >=0.21.0,<0.25.0
    - lightning >=2.5.1,<2.7
    - transformers >=5.3,<5.15
    - sentencepiece >=0.1.91,!=0.1.92
    - accelerate >=1.1.0,<2.0
    - requests >=2.30,<3
    - jsonschema >=4.18,<4.24
    - seqeval >=1.2.2,<1.3.0
    - evaluate >=0.4.0,<0.5.0
    - timm >=0.9.5,<1.0.7
    - scikit-image >=0.19.1,<0.26.0
    - text-unidecode >=1.3,<1.4
    - torchmetrics >=1.2.0,<1.8
    - omegaconf >=2.1.1,<2.4.0  # setup.py is <2.3.0 but it doesn't work with py311
    - pytorch-metric-learning >=1.3.0,<2.9
    - nlpaug >=1.1.10,<1.2.0
    - nltk >=3.4.5,<3.10
    - openmim >=0.3.7,<0.4.0
    - defusedxml >=0.7.1,<0.7.2
    - jinja2 >=3.0.3,<3.2
    - tensorboard >=2.9,<3
    - pytesseract >=0.3.9,<0.4
    - pdf2image >=1.17.0,<1.19
    - pyopenssl >=23.2.0  # issue https://github.com/conda/conda/issues/13619#issuecomment-2075825121
    - setuptools <82 # latest setuptools does not support pkg_resources
    - autogluon.core ==1.6.0.dev0
    - autogluon.features ==1.6.0.dev0
    - autogluon.common ==1.6.0.dev0

test:
  imports:
    - autogluon.multimodal
  commands:
    - python -c "from autogluon.multimodal import __version__ as v; from packaging.version import parse; expected = '{{ version }}'; assert parse(v) == parse(expected), f'{v} != {expected}'"
  requires:
    - pip
    - python {{ python_min }}
    # - pytorch =*=cuda*  # [linux and cuda_compiler_version != "None"]

about:
  home: https://pypi.org/project/autogluon.multimodal
  summary: AutoML for Image, Text, and Tabular Data
  description: |
    AutoGluon automates machine learning tasks enabling you to easily achieve strong 
    predictive performance in your applications. With just a few lines of code, you 
    can train and deploy high-accuracy machine learning and deep learning models on 
    image, text, time series, and tabular data.  
  dev_url: https://github.com/autogluon/autogluon/
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - shchur
    - Innixma
    - prateekdesai04
